<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'"><meta name="robots" content="noindex, nofollow"><title>넥스트플로우 | 랜딩페이지 미리보기</title><style>:root{--font-gothic-a1:Malgun Gothic;
  --color-nf-bg: #0e0f12;
  --color-nf-card: #1a1c22;
  --color-nf-line: #2a2d36;
  --color-nf-sub: #a3a9b8;
  --color-nf-faint: #6b7080;
  --color-nf-yellow: #ffd400;
  --color-nf-yellow-deep: #ffb800;
  --color-nf-on-yellow: #111111;
  --color-nf-done: #34d399;
  --color-nf-alert: #ff6b6b;
  --color-nf-paper: #ffffff;
  --color-nf-paper-ink: #121826;
  --color-nf-paper-sub: #5b6478;
  --color-nf-paper-line: #e3e6ec;
  --font-nf: var(--font-gothic-a1), "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --radius-nf-card: 18px;
}*,::before,::after{box-sizing:border-box;margin:0;padding:0;border:0 solid}html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:system-ui,sans-serif}button,input{font:inherit;color:inherit;background:transparent}button{cursor:pointer}a{color:inherit;text-decoration:inherit}ol,ul,menu{list-style:none}img,svg{vertical-align:middle}svg{display:inline-block}/* NEXTFLOW landing — mobile-first, scoped styles.
   Colors/fonts come from the Tailwind v4 tokens in src/app/globals.css (@theme static, --color-nf-*).
   Decisions: docs/research/nextflow/DESIGN.md */

.page {
  --bg: var(--color-nf-bg);
  --card: var(--color-nf-card);
  --line: var(--color-nf-line);
  --sub: var(--color-nf-sub);
  --faint: var(--color-nf-faint);
  --y: var(--color-nf-yellow);
  --y-deep: var(--color-nf-yellow-deep);
  --on-y: var(--color-nf-on-yellow);
  --done: var(--color-nf-done);
  --alert: var(--color-nf-alert);
  --paper: var(--color-nf-paper);
  --paper-ink: var(--color-nf-paper-ink);
  --paper-sub: var(--color-nf-paper-sub);
  --paper-line: var(--color-nf-paper-line);
  --radius: var(--radius-nf-card);
  --header-h: 60px;
  --tabs-h: 52px;

  min-height: 100vh;
  background: var(--bg);
  color: #fff;
  font-family: var(--font-nf);
  font-size: 16px;
  line-height: 1.6;
  letter-spacing: -0.01em;
  word-break: keep-all;
  overflow-wrap: break-word;
  padding-bottom: 80px; /* room for the sticky CTA bar */
}

.page :where(a, button, input, select, textarea, summary):focus-visible {
  outline: 3px solid var(--y);
  outline-offset: 3px;
}

.container {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
}

.skipLink {
  position: fixed;
  left: 12px;
  top: -80px;
  z-index: 100;
  padding: 10px 16px;
  border-radius: 999px;
  background: var(--y);
  color: var(--on-y);
  font-weight: 800;
}
.skipLink:focus {
  top: 12px;
}

/* ---------- Shared type ---------- */
.no {
  display: inline-block;
  color: var(--y);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.title {
  margin: 8px 0 0;
  font-size: clamp(26px, 6.6vw, 44px);
  font-weight: 900;
  line-height: 1.3;
  letter-spacing: -0.04em;
}
.title em,
.heroTitle em {
  font-style: normal;
  color: var(--y);
}
.lead {
  margin: 14px 0 0;
  max-width: 520px;
  color: var(--sub);
  font-size: 15px;
}
.section {
  padding: 56px 0;
  border-top: 1px solid var(--line);
  scroll-margin-top: calc(var(--header-h) + var(--tabs-h));
}
.split {
  display: grid;
  gap: 28px;
}

/* ---------- Buttons & chips ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 52px;
  padding: 0 24px;
  border: 2px solid transparent;
  border-radius: 999px;
  font-size: 16px;
  font-weight: 800;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.15s, background-color 0.15s, border-color 0.15s, color 0.15s;
}
.btn:hover {
  transform: translateY(-1px);
}
.btnYellow {
  background: linear-gradient(90deg, var(--y-deep), var(--y));
  color: var(--on-y);
}
.btnLine {
  border-color: var(--line);
  color: #fff;
}
.btnLine:hover {
  border-color: #fff;
}
.btnInk {
  background: var(--on-y);
  color: var(--y);
}
.btn[aria-disabled="true"] {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.chips li {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  font-size: 13px;
  font-weight: 700;
}
.chips svg {
  color: var(--y);
}

/* ---------- Header ---------- */
.header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(14, 15, 18, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.headerInner {
  height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.wordmark {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  color: #fff;
  text-decoration: none;
  white-space: nowrap;
}
.wordmarkKo {
  font-size: 19px;
  font-weight: 900;
  letter-spacing: -0.04em;
}
.wordmarkKo span {
  color: var(--y);
}
.wordmarkEn {
  display: none;
  color: var(--faint);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.2em;
}
.headerRight {
  display: flex;
  align-items: center;
  gap: 6px;
}
.headerPill {
  display: inline-flex;
  align-items: center;
  min-height: 40px;
  padding: 0 16px;
  border-radius: 999px;
  background: var(--y);
  color: var(--on-y);
  font-size: 14px;
  font-weight: 800;
  text-decoration: none;
  white-space: nowrap;
}
.menuButton {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  margin-right: -10px;
  border: 0;
  background: transparent;
  color: #fff;
  cursor: pointer;
}
.menuIcon,
.menuIcon::before,
.menuIcon::after {
  display: block;
  width: 20px;
  height: 2px;
  border-radius: 2px;
  background: currentColor;
  transition: transform 0.2s, background-color 0.2s;
}
.menuIcon {
  position: relative;
}
.menuIcon::before,
.menuIcon::after {
  content: "";
  position: absolute;
  left: 0;
}
.menuIcon::before {
  top: -6px;
}
.menuIcon::after {
  top: 6px;
}
.menuButton[aria-expanded="true"] .menuIcon {
  background: transparent;
}
.menuButton[aria-expanded="true"] .menuIcon::before {
  transform: translateY(6px) rotate(45deg);
}
.menuButton[aria-expanded="true"] .menuIcon::after {
  transform: translateY(-6px) rotate(-45deg);
}
.mobileMenu {
  position: fixed;
  inset: var(--header-h) 0 0 0;
  z-index: 49;
  overflow-y: auto;
  padding: 8px 20px 40px;
  background: var(--bg);
}
.mobileMenu[hidden] {
  display: none;
}
.mobileMenu ol {
  margin: 0;
  padding: 0;
  list-style: none;
}
.mobileMenu li a {
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding: 18px 0;
  border-bottom: 1px solid var(--line);
  color: #fff;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.03em;
  text-decoration: none;
}
.mobileMenu li a span {
  color: var(--y);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.1em;
}
.mobileMenu .btn {
  width: 100%;
  margin-top: 28px;
}
body.nf-menu-open {
  overflow: hidden;
}

/* ---------- Section tabs ---------- */
.tabs {
  position: sticky;
  top: var(--header-h);
  z-index: 40;
  background: rgba(14, 15, 18, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.tabsList {
  display: flex;
  gap: 6px;
  max-width: 1200px;
  margin: 0 auto;
  padding: 8px 20px;
  list-style: none;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabsList::-webkit-scrollbar {
  display: none;
}
.tabsList a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--sub);
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  text-decoration: none;
  transition: background-color 0.15s, color 0.15s, border-color 0.15s;
}
.tabsList a span {
  font-size: 11px;
  color: var(--faint);
}
.tabsList a:hover {
  color: #fff;
}
.tabsList a[aria-current="true"] {
  background: var(--y);
  border-color: var(--y);
  color: var(--on-y);
}
.tabsList a[aria-current="true"] span {
  color: var(--on-y);
}

/* ---------- Hero ---------- */
.hero {
  padding: 40px 0 48px;
  background: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.025) 0 2px, transparent 2px 24px);
}
.heroGrid {
  display: grid;
  gap: 36px;
}
.badge {
  display: inline-block;
  padding: 6px 14px;
  border: 2px solid var(--y);
  border-radius: 999px;
  color: var(--y);
  font-size: 15px;
  font-weight: 900;
}
.heroKicker {
  margin: 18px 0 0;
  font-size: 20px;
  font-weight: 800;
}
.heroTitle {
  margin: 10px 0 0;
  font-size: clamp(30px, 8vw, 52px);
  font-weight: 900;
  line-height: 1.25;
  letter-spacing: -0.045em;
}
.heroNumber {
  display: block;
  margin-top: 6px;
  color: var(--y);
  font-size: clamp(76px, 22vw, 136px);
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.06em;
}
.heroNumber small {
  font-size: 0.46em;
  letter-spacing: -0.03em;
}
.heroLead {
  margin: 16px 0 0;
  max-width: 480px;
  color: var(--sub);
  font-size: 16px;
}
.heroLead b {
  color: #fff;
}
.heroActions {
  display: grid;
  gap: 10px;
  margin-top: 26px;
}

/* Hero price ticket */
.ticket {
  position: relative;
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--card);
  box-shadow: 0 0 0 1px rgba(255, 212, 0, 0.12), 0 24px 60px rgba(0, 0, 0, 0.45);
}
.ticketHead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 14px;
  font-weight: 800;
}
.ticketHead span:last-child {
  color: var(--faint);
  font-size: 12px;
  font-weight: 700;
}
.ticketPrices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 16px 0 0;
}
.ticketPrices > div {
  padding: 16px;
  border-radius: 16px;
}
.ticketPrices dt {
  font-size: 14px;
  font-weight: 800;
}
.ticketPrices dd {
  margin: 4px 0 0;
  font-size: clamp(24px, 7vw, 32px);
  font-weight: 900;
  letter-spacing: -0.04em;
  line-height: 1.15;
}
.priceYellow {
  background: linear-gradient(135deg, var(--y-deep), var(--y));
  color: var(--on-y);
}
.priceOutline {
  border: 2px solid #fff;
}
.ticketFree {
  margin: 18px 0 0;
  color: var(--sub);
  font-size: 13px;
  font-weight: 700;
}
.ticketFree + .chips {
  margin-top: 8px;
}
.ticketFoot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px dashed var(--line);
  color: var(--sub);
  font-size: 13px;
}
.ticketFoot a {
  color: var(--y);
  font-weight: 800;
  text-decoration: none;
  white-space: nowrap;
}

/* ---------- 01 Why: lanes ---------- */
.flowBox {
  padding: 20px 16px;
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--paper-ink);
}
.lane {
  display: grid;
  gap: 10px;
}
.lane + .lane {
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px dashed var(--paper-line);
}
.laneLabel {
  font-size: 13px;
  font-weight: 800;
  color: var(--paper-sub);
}
.laneLabelUs {
  color: var(--paper-ink);
}
.laneNodes {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.node {
  padding: 8px 12px;
  border-radius: 999px;
  background: #eef0f4;
  font-size: 14px;
  font-weight: 800;
  white-space: nowrap;
}
.nodeCut {
  color: #9aa1b1;
  text-decoration: line-through;
  text-decoration-color: var(--alert);
  text-decoration-thickness: 2px;
}
.nodeUs {
  background: var(--on-y);
  color: var(--y);
}
.arrow {
  color: #9aa1b1;
  font-weight: 800;
}
.directLine {
  flex: 1 1 40px;
  min-width: 40px;
  height: 3px;
  border-radius: 3px;
  background: var(--on-y);
  position: relative;
}
.directLine::after {
  content: "";
  position: absolute;
  right: -2px;
  top: -5px;
  border: 6.5px solid transparent;
  border-left: 9px solid var(--on-y);
  border-right: 0;
}
.flowNote {
  margin: 16px 0 0;
  color: var(--paper-sub);
  font-size: 13px;
}

/* ---------- 02 Direct: bento ---------- */
.bento {
  display: grid;
  gap: 10px;
  margin: 28px 0 0;
  padding: 0;
  list-style: none;
}
.bentoCard {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--card);
}
.bentoIcon {
  flex: none;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: rgba(255, 212, 0, 0.12);
  color: var(--y);
}
.bentoCard h3 {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.03em;
}
.bentoCard p {
  margin: 4px 0 0;
  color: var(--sub);
  font-size: 14px;
}
/* 01 lead: 택배물류대행센터 직접 운영 강조 (yellow marker highlight) */
.leadHighlight {
  display: inline-block;
  margin: 8px 2px 6px 0;
  padding: 5px 12px;
  border-radius: 8px;
  background: var(--y);
  color: #111;
  font-size: 1.12em;
  font-weight: 900;
  line-height: 1.35;
  box-shadow: 0 0 0 3px rgba(255, 212, 0, 0.2);
}

/* Featured card: 택배물류대행센터 직접 운영 */
.bentoFeature {
  padding: 24px 20px;
  border: 0;
  background: linear-gradient(135deg, var(--y-deep, #ffb800), var(--y));
  color: #111;
  box-shadow: 0 0 0 4px rgba(255, 212, 0, 0.18), 0 18px 40px rgba(255, 184, 0, 0.18);
}
.bentoFeature .bentoIcon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: #111;
  color: var(--y);
}
.bentoFeature h3 {
  font-size: 22px;
  font-weight: 900;
  line-height: 1.3;
}
.bentoFeature p {
  margin-top: 6px;
  color: #2b2b2b;
  font-size: 15px;
  font-weight: 600;
}
.bentoBadge {
  display: inline-block;
  margin-bottom: 8px;
  padding: 3px 9px;
  border-radius: 999px;
  background: #111;
  color: var(--y);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.bentoStat {
  display: block;
  margin-bottom: 4px;
  color: var(--y);
  font-size: 34px;
  font-weight: 900;
  letter-spacing: -0.04em;
  line-height: 1.1;
}

/* ---------- 03 Dashboard ---------- */
.dash {
  margin: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--card);
  box-shadow: 0 0 0 1px rgba(255, 212, 0, 0.15), 0 20px 50px rgba(0, 0, 0, 0.4);
}
.dashHead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 15px;
  font-weight: 800;
}
.dashHead span:first-child {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.dashHead svg {
  color: var(--y);
}
.example {
  padding: 3px 9px;
  border-radius: 6px;
  background: var(--y);
  color: var(--on-y);
  font-size: 12px;
  font-weight: 700;
}
.dashProgress {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 16px 8px;
}
.dashProduct {
  color: var(--sub);
  font-size: 14px;
  font-weight: 600;
}
.dashPercent {
  color: var(--sub);
  font-size: 15px;
  font-weight: 800;
  white-space: nowrap;
}
.dashPercent b {
  color: var(--y);
  font-size: 40px;
  font-weight: 900;
  letter-spacing: -0.05em;
  line-height: 1;
}
.bar {
  height: 10px;
  margin: 0 16px;
  overflow: hidden;
  border-radius: 99px;
  background: var(--line);
}
.bar i {
  display: block;
  width: 70%;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--y-deep), var(--y));
}
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 0;
  padding: 16px;
}
.stats > div {
  padding: 12px 10px;
  border-radius: 12px;
  background: var(--bg);
}
.stats dt {
  color: var(--sub);
  font-size: 12px;
  font-weight: 700;
}
.stats dd {
  margin: 0;
}
.stats b {
  font-size: 24px;
  font-weight: 900;
}
.stats b small {
  color: var(--sub);
  font-size: 13px;
}
.state {
  display: table;
  margin-top: 4px;
  padding: 2px 7px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 800;
}
.stateDone {
  background: rgba(52, 211, 153, 0.15);
  color: var(--done);
}
.stateNow {
  background: rgba(255, 212, 0, 0.15);
  color: var(--y);
}
.timeline {
  margin: 0;
  padding: 0 16px 14px;
  list-style: none;
}
.timeline li {
  position: relative;
  margin-left: 6px;
  padding: 9px 0 9px 26px;
  border-left: 2px solid var(--line);
  color: var(--faint);
  font-size: 14px;
  font-weight: 600;
}
.timeline li::before {
  content: "";
  position: absolute;
  left: -7px;
  top: 13px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--line);
}
.timeline li span {
  display: inline-block;
  width: 48px;
  font-size: 12px;
  font-weight: 800;
}
.timeline li[data-state="done"] {
  color: #fff;
}
.timeline li[data-state="done"]::before {
  background: var(--done);
}
.timeline li[data-state="now"] {
  color: var(--y);
}
.timeline li[data-state="now"]::before {
  background: var(--y);
  box-shadow: 0 0 0 4px rgba(255, 212, 0, 0.25);
}
.dashFoot {
  padding: 11px 16px;
  border-top: 1px solid var(--line);
  color: var(--faint);
  font-size: 12px;
}
.dashFeatures {
  margin-top: 20px;
}

/* ---------- 04 Price & calculator ---------- */
.priceCards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 24px 0 0;
}
.priceCards > div {
  padding: 18px 16px;
  border-radius: var(--radius);
}
.priceCards dt {
  font-size: 15px;
  font-weight: 800;
}
.priceCards dd {
  margin: 2px 0 0;
  font-size: clamp(26px, 7.4vw, 36px);
  font-weight: 900;
  letter-spacing: -0.04em;
}
.priceCards dd small {
  display: block;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0;
  opacity: 0.75;
}
.freeTitle {
  margin: 22px 0 10px;
  color: var(--sub);
  font-size: 14px;
  font-weight: 800;
}
.freeChips li::before {
  content: "✓";
  color: var(--y);
  font-weight: 900;
}
.priceNotes {
  margin: 18px 0 0;
  padding: 0;
  list-style: none;
  color: var(--faint);
  font-size: 13px;
}
.priceNotes li::before {
  content: "· ";
}

.calc {
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--card);
}
.calcTitle {
  margin: 0;
  font-size: 20px;
  font-weight: 900;
}
.calcHint {
  margin: 4px 0 0;
  color: var(--sub);
  font-size: 14px;
}
.qty {
  display: block;
  margin-top: 20px;
}
.qty > span {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: 800;
}
.qtyRow {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  border: 2px solid var(--line);
  border-radius: 14px;
  background: var(--bg);
  transition: border-color 0.15s;
}
.qtyRow:focus-within {
  border-color: var(--y);
}
.qtyRow input {
  flex: 1;
  min-width: 0;
  height: 58px;
  border: 0;
  background: transparent;
  color: #fff;
  font: inherit;
  font-size: 26px;
  font-weight: 900;
  outline: none;
}
.qtyRow input::placeholder {
  color: var(--faint);
}
.qtyRow b {
  color: var(--sub);
  font-weight: 800;
}
.presets {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.presets button {
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--sub);
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.presets button:hover,
.presets button[aria-pressed="true"] {
  border-color: var(--y);
  color: var(--y);
}
.result {
  margin: 18px 0 0;
  padding: 16px;
  border-radius: 14px;
  background: var(--bg);
}
.result > div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 0;
  font-size: 14px;
}
.result dt {
  color: var(--sub);
}
.result dt small {
  display: block;
  color: var(--faint);
  font-size: 12px;
}
.result dd {
  margin: 0;
  font-weight: 800;
  text-align: right;
  white-space: nowrap;
}
.result .total {
  margin-top: 8px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.result .total dt {
  color: #fff;
  font-weight: 800;
}
.result .total dd {
  color: var(--y);
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -0.03em;
}
.calcNote {
  margin: 12px 0 0;
  color: var(--faint);
  font-size: 12px;
}
.calc .btn {
  width: 100%;
  margin-top: 16px;
}

/* ---------- Compare (flag) ---------- */
.compareWrap {
  margin-top: 24px;
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.compare {
  width: 100%;
  min-width: 420px;
  border-collapse: collapse;
  background: var(--card);
  font-size: 14px;
  text-align: center;
}
.compare th {
  padding: 12px 8px;
  background: var(--y);
  color: var(--on-y);
  font-weight: 800;
}
.compare td {
  padding: 12px 8px;
  border-top: 1px solid var(--line);
  color: var(--sub);
}
.compare .us {
  color: #fff;
  font-weight: 900;
}
.compare .save {
  color: var(--alert);
  font-weight: 900;
}

/* ---------- FAQ ---------- */
.faqList {
  display: grid;
  gap: 10px;
}
.faqItem {
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--card);
  transition: border-color 0.15s;
}
.faqItem[open] {
  border-color: var(--y);
}
.faqItem summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 20px;
  font-size: 16px;
  font-weight: 800;
  list-style: none;
  cursor: pointer;
}
.faqItem summary::-webkit-details-marker {
  display: none;
}
.faqItem summary::after {
  content: "+";
  flex: none;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--line);
  color: var(--y);
  font-size: 18px;
  font-weight: 900;
  line-height: 1;
}
.faqItem[open] summary::after {
  content: "−";
  background: var(--y);
  color: var(--on-y);
}
.faqItem p {
  margin: 0;
  padding: 0 20px 20px;
  color: var(--sub);
  font-size: 15px;
}

/* ---------- Promise ---------- */
.promiseGrid {
  display: grid;
  gap: 10px;
  margin: 28px 0 0;
  padding: 0;
  list-style: none;
}
.promise {
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--card);
}
.promise b {
  color: var(--y);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.1em;
}
.promise h3 {
  margin: 8px 0 0;
  font-size: 18px;
  font-weight: 800;
}
.promise p {
  margin: 6px 0 0;
  color: var(--sub);
  font-size: 14px;
}
.refund {
  /* keep the horizontal case row from widening the page */
  min-width: 0;
  max-width: 100%;
  margin-top: 14px;
  padding: 22px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
}
.refund h3 {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
}
.refund dl {
  margin: 10px 0 0;
}
.refund dl > div {
  display: grid;
  gap: 2px;
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.refund dt {
  font-size: 14px;
  font-weight: 700;
}
.refund dd {
  margin: 0;
  color: var(--faint);
  font-size: 14px;
}

/* ---------- Contact ---------- */
.channels {
  margin: 24px 0 0;
  padding: 0;
  list-style: none;
}
.channels li {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.channels li span:first-child {
  color: var(--faint);
  font-weight: 700;
}
.channels a {
  color: #fff;
}
.contactActions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 20px;
}
.formBox {
  padding: 24px 20px;
  border-radius: 20px;
  background: var(--paper);
  color: var(--paper-ink);
}
.formTitle {
  margin: 0;
  font-size: 24px;
  font-weight: 900;
  letter-spacing: -0.03em;
}
.formDesc {
  margin: 4px 0 0;
  color: var(--paper-sub);
  font-size: 15px;
}
.fields {
  display: grid;
  gap: 14px;
  margin-top: 20px;
}
.field {
  display: grid;
  gap: 6px;
  font-size: 14px;
  font-weight: 800;
}
.field i {
  font-style: normal;
  color: #e5484d;
}
.field input {
  width: 100%;
  min-height: 52px;
  padding: 0 14px;
  border: 1.5px solid var(--paper-line);
  border-radius: 12px;
  background: #f7f8fa;
  color: var(--paper-ink);
  font: inherit;
  font-weight: 500;
  transition: border-color 0.15s, background-color 0.15s;
}
.field input::placeholder {
  color: #9aa1b1;
}
.field input:focus {
  border-color: var(--paper-ink);
  background: #fff;
}
.field input[aria-invalid="true"] {
  border-color: #e5484d;
}
.consent {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 16px;
  padding: 14px;
  border-radius: 12px;
  background: #f3f4f7;
  font-size: 14px;
}
.consent label {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}
.consent input {
  flex: none;
  width: 22px;
  height: 22px;
  margin: 0;
  accent-color: var(--on-y);
  cursor: pointer;
}
.consent b {
  color: #e5484d;
}
.consentToggle {
  flex: none;
  border: 0;
  background: none;
  color: var(--paper-sub);
  font: inherit;
  font-size: 13px;
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}
.consentText {
  margin: 8px 0 0;
  padding: 12px 14px;
  border-radius: 12px;
  background: #f7f8fa;
  color: var(--paper-sub);
  font-size: 13px;
  line-height: 1.65;
}
.consentText a {
  color: var(--paper-ink);
  font-weight: 700;
}
.status {
  margin: 14px 0 0;
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
}
.statusError {
  background: #fff0f0;
  color: #b42318;
}
.statusInfo {
  background: #fff8d6;
  color: #5c4500;
}
.formBox .btn {
  width: 100%;
  margin-top: 16px;
  border-radius: 14px;
}

/* ---------- Footer ---------- */
.footer {
  padding: 32px 0 28px;
  border-top: 1px solid var(--line);
  color: var(--faint);
  font-size: 13px;
  line-height: 1.8;
}
.footerTop {
  display: grid;
  gap: 8px;
}
.footerTop p {
  margin: 0;
  color: var(--sub);
}
.footerBottom {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 10px;
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}
.footerLinks {
  display: flex;
  gap: 16px;
}
.footerLinks a {
  color: var(--sub);
}

/* ---------- Sticky CTA ---------- */
.dock {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 45;
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 8px;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: rgba(14, 15, 18, 0.96);
  backdrop-filter: blur(10px);
}
.dock .btn {
  min-height: 50px;
  padding: 0 12px;
  border-radius: 14px;
  font-size: 15px;
}


/* ---------- Mobile-first single column (designed at 360 / 390 / 430px) ----------
   Wider screens keep the same vertical flow: content is centered and capped at --col. */
.page {
  --col: 540px;
  padding-bottom: calc(96px + env(safe-area-inset-bottom)); /* clear the fixed CTA bar */
}
.container,
.tabsList {
  max-width: var(--col);
}
.mobileMenu > * {
  max-width: calc(var(--col) - 40px);
  margin-inline: auto;
}
.split > *,
.heroGrid > * {
  min-width: 0;
}

/* Type scale capped for the narrow column */
.title {
  font-size: clamp(26px, 7.2vw, 34px);
}
.heroTitle {
  font-size: clamp(30px, 8.6vw, 40px);
}
.heroNumber {
  font-size: clamp(68px, 21vw, 112px);
}

/* Touch targets ≥ 44px */
.headerPill,
.tabsList a,
.presets button {
  min-height: 44px;
}
.consent label {
  min-height: 44px;
}
.consentToggle {
  min-height: 44px;
  padding: 0 4px;
}
.footerLinks a,
.footerLinks span {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
}
.footerLinks {
  flex-wrap: wrap;
  column-gap: 16px;
  row-gap: 0;
}

/* Fixed CTA bar: full width on phones, centered column on wider screens */
.dock {
  max-width: var(--col);
  margin-inline: auto;
}
@media (min-width: 541px) {
  .dock {
    bottom: 12px;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding-bottom: 10px;
  }
}

/* Comparison table must fit 360px without sideways scrolling */
.compare {
  min-width: 0;
  font-size: 13px;
}
.compare th,
.compare td {
  padding: 10px 4px;
}

@media (prefers-reduced-motion: reduce) {
  .page *,
  .page *::before,
  .page *::after {
    transition: none !important;
  }
}

/* iOS: inputs ≥ 16px to avoid auto-zoom */
.field input {
  font-size: 16px;
}
/* More ≥ 44px touch targets */
.wordmark {
  min-height: 44px;
  align-items: center;
}
.ticketFoot a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
}

/* FAQ answers: paragraphs, bullet lists, ※ notes (user manuscript in faq.ts) */
.faqItem summary {
  justify-content: flex-start;
  gap: 12px;
  min-height: 56px;
  line-height: 1.45;
}
.faqItem summary::after {
  margin-left: auto;
}
.faqQ {
  flex: none;
  color: var(--y);
  font-size: 15px;
  font-weight: 900;
}
.faqQuestion {
  flex: 1;
  min-width: 0;
}
.faqAnswer {
  display: grid;
  gap: 12px;
  padding: 0 20px 20px 46px;
  color: var(--sub);
  font-size: 15px;
  line-height: 1.7;
}
.faqItem .faqAnswer p {
  margin: 0;
  padding: 0;
}
.faqAnswer ul {
  display: grid;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.faqAnswer li {
  position: relative;
  padding-left: 16px;
}
.faqAnswer li::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 0.7em;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--y);
}
.faqItem .faqAnswer .faqNote {
  color: var(--faint);
  font-size: 13px;
  line-height: 1.6;
}
@media (max-width: 380px) {
  .faqAnswer {
    padding-left: 20px;
  }
}

/* Refund cases (user-approved copy in config.refundPolicy) */
.refundIntro {
  margin: 6px 0 0;
  color: var(--sub);
  font-size: 14px;
}
/* Horizontal swipe row: cards sit side by side, next card peeks in */
.refundList {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 78%;
  min-width: 0;
  max-width: 100%;
  gap: 10px;
  margin: 16px 0 0;
  padding: 0 0 10px;
  list-style: none;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.refundList:focus-visible {
  outline: 2px solid var(--y);
  outline-offset: 4px;
  border-radius: 14px;
}
.refundList li {
  display: flex;
  flex-direction: column;
  padding: 16px;
  border-radius: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  scroll-snap-align: start;
}
.refundLabel {
  display: block;
  color: var(--y);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.12em;
}
.refundList strong {
  display: block;
  margin-top: 6px;
  font-size: 16px;
  font-weight: 800;
}
.refundList p {
  margin: 6px 0 0;
  color: var(--sub);
  font-size: 14px;
  line-height: 1.65;
}

/* Longer CTA label ("무료상담받기") must stay on one line at 360px */
.headerPill,
.dock .btn {
  white-space: nowrap;
}
@media (max-width: 374px) {
  .headerPill {
    padding: 0 12px;
    font-size: 13px;
  }
  .dock .btn {
    font-size: 14px;
  }
}

/* 04 — per-item cost breakdown card */
.costCard {
  margin-top: 24px;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--card);
}
.costHead {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.costHead h3 {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.4;
}
.costChip {
  flex: none;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--y);
  color: var(--on-y);
  font-size: 12px;
  font-weight: 800;
}
.costRows {
  margin: 14px 0 0;
}
.costRows > div {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.costRows dt {
  color: #fff;
  font-size: 15px;
  font-weight: 600;
}
.costRows dd {
  margin: 0;
  color: #fff;
  font-size: 17px;
  font-weight: 800;
  text-align: right;
}
.costRows .costSoft {
  color: var(--sub);
  font-size: 14px;
  font-weight: 700;
}
.costTotal {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px 12px;
  padding-top: 16px;
}
.costTotal > span {
  color: var(--sub);
  font-size: 14px;
  font-weight: 700;
  padding-bottom: 6px;
}
.costTotal strong {
  color: var(--y);
  font-size: clamp(36px, 11vw, 44px);
  font-weight: 900;
  letter-spacing: -0.04em;
  line-height: 1.1;
}
.costTotal small {
  color: var(--sub);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0;
}
.costNote {
  margin: 12px 0 0;
  color: var(--faint);
  font-size: 12px;
  line-height: 1.6;
}

/* Keep the multi-step lane on one row at 360px */
.laneNodes {
  gap: 4px;
}
.node {
  padding: 7px 10px;
  font-size: 13px;
}
.arrow {
  font-size: 13px;
}
